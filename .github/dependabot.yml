version: 2
updates:
  # Frontend — npm
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(frontend)"
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    ignore:
      # typescript-eslint (pulled in via eslint-config-next) doesn't support
      # TS 7 yet: https://github.com/typescript-eslint/typescript-eslint/issues/10940
      # Remove this once that lands, then let dev-dependencies pick it up again.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "frontend"

  # Backend — pip
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(backend)"
    labels:
      - "dependencies"
      - "backend"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(github-actions)"
    labels:
      - "dependencies"

  # Docker — backend image
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(backend-docker)"
    labels:
      - "dependencies"
      - "docker"
      - "backend"

  # Docker — frontend image
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(frontend-docker)"
    labels:
      - "dependencies"
      - "docker"
      - "frontend"
